# @package training
run_id: ${now:%Y%m%d_%H%M%S}
output_dir: ${paths.reports}/training/${training.run_id}
models_run_dir: ${paths.models}/${training.run_id}
models_latest_dir: ${paths.models}/latest
experiment_name: employee_attrition
mlflow_tracking_uri: ${paths.outputs}/mlruns

models:
  - logistic_regression
  - random_forest
  - xgboost
  - lightgbm
  - catboost

metric: roc_auc
cv_folds: 5
random_state: ${seed}
classification_threshold: 0.5

optuna:
  enabled: true
  n_trials: 20
  timeout: null
  direction: maximize
  n_jobs: 1

logistic_regression:
  n_iter: 20
  search_space:
    C: [1e-3, 1e-2, 1e-1, 1.0, 10.0, 100.0]
    l1_ratio: [0.0, 0.25, 0.5, 0.75, 1.0]

random_forest:
  n_iter: 20
  search_space:
    n_estimators: [100, 150, 200, 250, 300, 350, 400, 450, 500]
    max_depth: [3, 5, 7, 9, 11, 13, 15, 17, 19]
    min_samples_split: [2, 3, 4, 5, 6, 7, 8, 9, 10]
    min_samples_leaf: [1, 2, 3, 4, 5]

xgboost:
  n_trials: ${training.optuna.n_trials}

lightgbm:
  n_trials: ${training.optuna.n_trials}

catboost:
  n_trials: ${training.optuna.n_trials}

save_artifacts: true
best_model_name: best_model
