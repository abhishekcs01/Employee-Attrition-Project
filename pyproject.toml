[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-attrition"
version = "0.1.0"
description = "Employee Attrition Prediction — Phase 1 notebook series with future ML pipeline scaffolding"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek" }]
dependencies = [
    "torch>=2.1",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "imbalanced-learn>=0.12",
    "shap>=0.45",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    "ydata-profiling>=4.6",
    "sdv>=1.12",
    "sdmetrics>=0.14",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "streamlit>=1.32",
    "python-multipart>=0.0.9",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "mlflow>=2.11",
    "optuna>=3.6",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "kaleido>=0.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.3",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[project.scripts]
eda-run = "src.eda.run:main"
synthetic-run = "src.synthetic.train:main"
validation-run = "src.validation.run:main"
features-run = "src.features.engineer:main"
training-run = "src.training.train:main"
training-compare = "src.training.compare:main"
evaluation-run = "src.evaluation.evaluate:main"
explainability-run = "src.explainability.generate:main"
api-run = "src.deployment.api.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov-report=term-missing"
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]
